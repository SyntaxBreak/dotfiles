# BACKGROUND
background {
    monitor =
    path = ~/Pictures/Wallpapers/Lockscreen.png
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    fail_timeout = 100
    hide_cursor = true
}

auth {
    fingerprint:enabled = true
    fingerprint:retry_delay = 150
}

# Time-Hour
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I")</span>"
    color = rgba(255, 255, 255, 1)
    font_size = 175
    font_family = StretchPro
    position = -80, 200
    halign = center
    valign = center
}

# Time-Minute
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%M")</span>"
    color = rgba(147, 196, 255, 1)
    font_size = 175
    font_family = StretchPro
    position = 0, 25
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %B, %a.")"
    color = rgba(255, 255, 255, 100)
    font_size = 24
    font_family = Suisse Int'l Mono
    position = 20, -90
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text = Syntax
    color = rgba(216, 222, 233, 0.80)
    font_size = 28
    font_family = SF Pro Display Bold
    position = 0, 300
    halign = center
    valign = bottom
}

# INPUT FIELD
input-field {
    monitor =
    size = 320, 80
    rounding = 4
    outline_thickness = 30
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <span foreground="##ffffff99">Enter Password</span>
    hide_input = false
    position = 0, 200
    halign = center
    valign = bottom
}

