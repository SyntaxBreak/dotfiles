# BACKGROUND
background {
    monitor =
    path = /home/syntax/Pictures/Wallpapers/Lockscreen.jpg
    blur_passes = 1
    blur_size = 5
    contrast = 1
    brightness = 0.8
    vibrancy = 0.4
    vibrancy_darkness = 0.2
}

# GENERAL
general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 100
}

auth {
    fingerprint:enabled = true
    fingerprint:retry_delay = 50
}
# INPUT FIELD
input-field {
    monitor =
    size = 400, 60
    outline_thickness = 2
    dots_size = 0.3 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.35 # Scale of dots' absolute size, 0.0 - 1.0
    dots_rounding = 3
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.7)
    font_color = rgba(255,255,255, 0.8)
    fade_on_empty = true
    rounding = 5
    check_color = rgb(204, 136, 34)
    hide_input = false
    position = 0, 80
    halign = center
    valign = bottom
    placeholder_text = 
    fail_text = 
}

# DATE
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 22
  font_family = JetBrains Mono
  position = 0, 80
  halign = center
  valign = center
}

# TIME
label {
  monitor = 
  text = $TIME
  color = rgba(242, 243, 244, 0.75)
  font_size = 95
  font_family = JetBrains Mono Extrabold
  position = 0, 0
  halign = center
  valign = center
}